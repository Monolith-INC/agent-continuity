name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lockstep and skill frontmatter
        run: ./scripts/validate.sh
      - name: Hook tests
        run: python3 -m unittest discover -s hooks/tests -v
      - name: Adapter packaging tests
        run: python3 -m unittest discover -s adapters/tests -v
      - name: Build all host marketplaces
        run: ./scripts/build_all.sh
